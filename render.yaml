
# CampBlazer Render Blueprint
# One web service: Django + React + WebSockets

services:
  - type: web
    name: erahmae-campblazer-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: bash backend/render-build.sh
    startCommand: cd backend && bash render-start.sh
    healthCheckPath: /api/system/info/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: NODE_VERSION
        value: "20"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: DEMO_PASSWORD
        generateValue: true
      - key: GUNICORN_WORKERS
        value: "2"
